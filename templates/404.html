<!DOCTYPE html>
<html lang="en">
<head>
    <!-- page details -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <!-- website icon -->
    <link rel="icon" type="image/png"
      href="/static/images/favicon.png">

    <!-- error page styling -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/error.css') }}">
</head>

<body>
    <!-- top navigation section with the school logo and website name -->
    <header class="error-header">
        <img class="error-logo"
             src="{{ url_for('static', filename='images/burnside-logo.png') }}"
             alt="Burnside High School logo">
        <span class="error-brand">Attendance Verification System</span>
    </header>

    <!-- main section of the error page -->
    <main class="error-main">
        <section class="error-card">

            <!-- show the error code and message -->
            <h2 class="error-number">404</h2>
            <h1 class="error-title">Page Not Found</h1>

            <!-- message shown when the requested page cannot be found -->
            <p class="error-message">
                Sorry, we couldn't find the page you're looking for.
                Please check the address and try again.
            </p>

            <!-- take the user back to the login page -->
            <a class="error-button" href="{{ url_for('routes.login') }}">
                Return to Login
            </a>
        </section>
    </main>

    <!-- footer at the bottom of the page -->
    <footer class="error-footer">
        <p>&copy; 2026 Burnside High School</p>
        <span>Attendance Verification System</span>
    </footer>

</body>
</html>
