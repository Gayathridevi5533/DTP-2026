<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='traillayout.css') }}">

</head>

<body>

    <div class="signup-container">

        <!-- LEFT IMAGE SECTION -->

        <div class="image-side">

            <img
                src="{{ url_for('static', filename='images/hero.jpg') }}"
                alt="Burnside Students">

        </div>


        <!-- RIGHT FORM SECTION -->

        <div class="form-side">

            <div class="form-card">

                <h1>Create Account</h1>

                <form method="POST">

                    <!-- FULL NAME -->

                    <label for="username">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your full name"
                        required>


                    <!-- EMAIL -->

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your school email"
                        required>


                    <!-- STUDENT ID -->

                    <label for="student_code">
                        Student ID
                    </label>

                    <input
                        type="text"
                        id="student_code"
                        name="student_code"
                        placeholder="Enter your student ID"
                        maxlength="5"
                        required>


                    <!-- PASSWORD -->

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required>

                        <span
                            class="toggle-password"
                            onclick="togglePassword()">
                            👁
                        </span>

                    </div>


                    <!-- BUTTON -->

                    <button type="submit">
                        Create Account
                    </button>


                    <!-- LOGIN LINK -->

                    <p class="login-link">

                        Already have an account?

                        <a href="{{ url_for('routes.login') }}">
                            Login
                        </a>

                    </p>

                </form>

            </div>

        </div>

    </div>


    <script>

        function togglePassword() {

            let password =
                document.getElementById("password");

            if (password.type === "password") {

                password.type = "text";

            }

            else {

                password.type = "password";

            }
        }

    </script>

</body>

</html>
