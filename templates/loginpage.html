<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>

    <link rel="icon" type="image/png"
      href="/static/images/favicon.png">

    <link rel="stylesheet" href="/static/css/loginpage.css">
</head>

<body>

    <!-- The Nav -->
    <nav class="navbar">

        <div class="navbar-content">

            <img src="{{ url_for('static', filename='images/burnside-logo.png') }}"
                alt="Burnside Logo"
                class="logo">

            <h2>Attendance Verification System</h2>

        </div>

    </nav>

    <!-- Login Section -->
        <main class="login-container">

        <div class="login-image">

            <img src="{{ url_for('static', filename='images/burnside-campus.jpg') }}"
                    alt="Burnside Students">

        </div>

        <div class="login-card">

            <h1>Welcome Back</h1>
            <p class="subtitle">
                Sign in to verify your attendance
            </p>

            {% if error %}
                <p class="login-error">{{ error }}</p>
            {% endif %}

            <form method="POST"> 
 
                <label for="student_code">Student ID</label> 
            
                <input 
                    type="text" 
                    id="student_code" 
                    name="student_code" 
                    required 
                > 
            
                <label for="password">Password</label>

                <div class="password-input">

                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                    >

                </div>
            
                <button type="submit"> 
                    Sign In & Record Attendance 
                </button> 
            
            </form>

            <a href="{{ url_for('routes.forgot_password') }}">
                Forgot password?
            </a>

        </div>

        </main>

    <!-- =========================
        PAGE FOOTER
    ========================= -->

<footer class="teacher-footer">
    <p>&copy; 2026 Burnside High School</p>
    <span>Attendance Verification System</span>
</footer>


</body>
</html>
