<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- page title -->
    <title>Reset Password</title>

    <!-- website icon -->
    <link rel="icon" type="image/png"
      href="/static/images/favicon.png">

    <!-- CSS -->
    <link rel="stylesheet"
        href="/static/css/reset_password.css">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- =========================
         TOP NAVBAR
    ========================== -->

    <!-- navigation bar containing the school logo -->
    <header class="top-navbar">

        <div class="school-brand">

            <!-- Burnside High School logo -->
            <img
                src="{{ url_for('static', filename='images/burnside-logo.png') }}"
                alt="Burnside High School"
                class="school-logo"
            >

        </div>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <!-- main section containing the reset password form -->
    <main class="page-content">

        <!-- reset password card -->
        <div class="password-card">

            <!-- Decorative heading line -->
            <div class="heading-decoration">

                <div class="heading-line"></div>

                <!-- lock icon displayed above the heading -->
                <div class="lock-circle">
                    <i class="fa-solid fa-lock"></i>
                </div>

                <div class="heading-line"></div>

            </div>


            <!-- Page title -->
            <h1>Reset Password</h1>


            <!-- Flask flash messages -->
            <!-- display messages sent from Flask -->
            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    {% for message in messages %}

                        <p class="flash-message">
                            {{ message }}
                        </p>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <!-- Password form -->
            <!-- check the passwords before submitting the form -->
            <form method="POST"
                  onsubmit="return validatePassword()">

                <!-- New Password -->
                <!-- input for entering the new password -->
                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <div class="password-input">

                        <!-- lock icon beside the password input -->
                        <i class="fa-solid fa-lock input-icon"></i>

                        <input
                            type="password"
                            name="password"
                            id="newPassword"
                            placeholder="Enter your new password"
                            required
                        >

                        <!-- button to show or hide the password -->
                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword('newPassword', this)"
                            aria-label="Show password"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->
                <!-- input for confirming the new password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <div class="password-input">

                        <!-- lock icon beside the password input -->
                        <i class="fa-solid fa-lock input-icon"></i>

                        <input
                            type="password"
                            name="confirm_password"
                            id="confirmPassword"
                            placeholder="Confirm your new password"
                            required
                        >

                        <!-- button to show or hide the password -->
                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword('confirmPassword', this)"
                            aria-label="Show password"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- display password validation errors -->
                <p id="errorMessage" class="error"></p>


                <!-- Submit button -->
                <button type="submit" class="change-password-button">

                    <i class="fa-solid fa-lock"></i>

                    <span>Change Password</span>

                </button>

            </form>

        </div>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        // check that the entered passwords are valid
        function validatePassword() {

            // get the new password entered by the user
            const newPassword =
                document.getElementById("newPassword").value;

            // get the confirmed password
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            // get the element used to display error messages
            const errorMessage =
                document.getElementById("errorMessage");

            // clear any previous error message
            errorMessage.textContent = "";


            // check that the password has at least 8 characters
            if (newPassword.length < 8) {

                errorMessage.textContent =
                    "Password must be at least 8 characters long.";

                return false;
            }


            // check that both passwords match
            if (newPassword !== confirmPassword) {

                errorMessage.textContent =
                    "New passwords do not match.";

                return false;
            }


            // allow the form to be submitted if both checks pass
            return true;
        }


        // show or hide the password when the eye button is clicked
        function togglePassword(inputId, button) {

            // get the password input and its eye icon
            const input =
                document.getElementById(inputId);

            const icon =
                button.querySelector("i");


            // show the password if it is currently hidden
            if (input.type === "password") {

                input.type = "text";

                // change the eye icon
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");

                // update the button label
                button.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                // hide the password again
                input.type = "password";

                // change the icon back to the normal eye
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");

                // update the button label
                button.setAttribute(
                    "aria-label",
                    "Show password"
                );
            }
        }

    </script>

</body>

</html>
