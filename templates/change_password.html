<!DOCTYPE html>
<html lang="en">

<head>
    <!-- page details -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>

    <!-- website icon -->
    <link rel="icon" type="image/png"
      href="/static/images/favicon.png">

    <!-- CSS for the change password page -->
    <link rel="stylesheet"
        href="/static/css/change_password.css">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- =========================
         TOP NAVBAR
    ========================== -->

    <header class="top-navbar">

        <div class="school-brand">

            <!-- Burnside High School logo -->
            <img
                src="{{ url_for('static', filename='images/burnside-logo.png') }}"
                alt="Burnside High School"
                class="school-logo"
            >

        </div>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="page-content">

        <!-- main card containing the password form -->
        <div class="password-card">

            <!-- decorative heading line and lock icon -->
            <div class="heading-decoration">

                <div class="heading-line"></div>

                <div class="lock-circle">
                    <i class="fa-solid fa-lock"></i>
                </div>

                <div class="heading-line"></div>

            </div>


            <!-- Page title -->
            <h1>Change Password</h1>


            <!-- display any messages sent from Flask -->
            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    {% for message in messages %}

                        <p class="flash-message">
                            {{ message }}
                        </p>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <!-- form for changing the password -->
            <form method="POST"
                  onsubmit="return validatePassword()">


                <!-- Current Password -->
                <div class="form-group">

                    <label for="currentPassword">
                        Current Password
                    </label>

                    <div class="password-input">

                        <!-- lock icon beside the input -->
                        <i class="fa-solid fa-lock input-icon"></i>

                        <!-- input for the user's current password -->
                        <input
                            type="password"
                            name="current_password"
                            id="currentPassword"
                            placeholder="Enter your current password"
                            required
                        >

                        <!-- button to show or hide the password -->
                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword('currentPassword', this)"
                            aria-label="Show password"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- New Password -->
                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <div class="password-input">

                        <i class="fa-solid fa-lock input-icon"></i>

                        <!-- input for the new password -->
                        <input
                            type="password"
                            name="new_password"
                            id="newPassword"
                            placeholder="Enter your new password"
                            required
                        >

                        <!-- button to show or hide the password -->
                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword('newPassword', this)"
                            aria-label="Show password"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <div class="password-input">

                        <i class="fa-solid fa-lock input-icon"></i>

                        <!-- input to confirm the new password -->
                        <input
                            type="password"
                            name="confirm_password"
                            id="confirmPassword"
                            placeholder="Confirm your new password"
                            required
                        >

                        <!-- button to show or hide the password -->
                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword('confirmPassword', this)"
                            aria-label="Show password"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- display password validation errors here -->
                <p id="errorMessage" class="error"></p>


                <!-- button to submit the password change form -->
                <button type="submit" class="change-password-button">

                    <i class="fa-solid fa-lock"></i>

                    <span>Change Password</span>

                </button>

            </form>

        </div>

        <!-- footer at the bottom of the page -->
        <footer class="teacher-footer">
            <p>&copy; 2026 Burnside High School</p>
            <span>Attendance Verification System</span>
        </footer>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        // check the new password before submitting the form
        function validatePassword() {

            // get the values entered in the password fields
            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            // get the element used to display error messages
            const errorMessage =
                document.getElementById("errorMessage");

            // clear any previous error message
            errorMessage.textContent = "";


            // check that the new password has at least 8 characters
            if (newPassword.length < 8) {

                errorMessage.textContent =
                    "Password must be at least 8 characters long.";

                return false;
            }


            // check that both password fields match
            if (newPassword !== confirmPassword) {

                errorMessage.textContent =
                    "New passwords do not match.";

                return false;
            }


            // allow the form to be submitted if everything is correct
            return true;
        }


        // show or hide the password when the eye button is clicked
        function togglePassword(inputId, button) {

            // get the password input and its eye icon
            const input =
                document.getElementById(inputId);

            const icon =
                button.querySelector("i");


            // change the input type to show the password
            if (input.type === "password") {

                input.type = "text";

                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");

                button.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                // hide the password again
                input.type = "password";

                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");

                button.setAttribute(
                    "aria-label",
                    "Show password"
                );
            }
        }

    </script>

</body>

</html>
